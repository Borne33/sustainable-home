<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>The Sustainable Home — Consumables</title>
<style>
:root{
  color-scheme: light;
  --bg:#F1EFE8; --card:#ffffff; --muted:#F1EFE8; --border:#E3E1D8; --strong:#D3D1C7;
  --ink:#173404; --ink2:#5F5E5A; --ink3:#888780;
  --green:#639922; --green2:#97C459; --greenbg:#EAF3DE; --greentx:#27500A; --leaf:#C0DD97;
  --radius:12px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.4}
.wrap{max-width:460px;margin:0 auto;padding:14px 12px 104px}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-0.15em}
.ic text{stroke:none;fill:currentColor}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green2);outline-offset:0}

.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:8px}
.logo{width:30px;height:30px;border-radius:50%;background:var(--leaf);display:flex;align-items:center;justify-content:center;color:var(--greentx);font-size:18px}
.brand small{display:block;font-size:11px;color:var(--green);letter-spacing:.02em}
.brand b{display:block;font-size:17px;font-weight:500;color:var(--ink);line-height:1.1}
.iconbtn{width:32px;height:32px;border-radius:8px;background:var(--card);border:.5px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:16px;padding:0}
.iconbtn.act{background:var(--greenbg);border-color:var(--green2);color:var(--greentx)}

.addbar{background:var(--card);border:.5px solid var(--border);border-radius:var(--radius);padding:8px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.addplus{background:none;border:none;color:var(--green);font-size:18px;display:flex;align-items:center;padding:0 2px}
#newname{flex:1;border:none;background:transparent;height:30px;font-size:15px}
#newname:focus{outline:none}
.dtoggle{background:none;border:none;color:var(--green);font-size:12px;display:flex;align-items:center;gap:3px;white-space:nowrap}
.draft{background:var(--card);border:.5px solid var(--border);border-radius:var(--radius);padding:12px;margin:-4px 0 10px}

.frow{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.pills{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;font-size:12px;background:var(--card);border:.5px solid var(--border);color:var(--ink2);border-radius:20px;padding:5px 12px;white-space:nowrap}
.pill.on{background:var(--greenbg);border-color:var(--green2);color:var(--greentx);font-weight:500}
.tools{flex:none;display:flex;gap:4px}

.searchbar{display:flex;align-items:center;gap:8px;background:var(--card);border:.5px solid var(--border);border-radius:var(--radius);padding:6px 10px;margin-bottom:12px}
.searchbar input{flex:1;border:none;background:transparent;height:26px}
.searchbar input:focus{outline:none}

.slabel{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin:0 2px 6px}
.list{display:flex;flex-direction:column;gap:8px}

.item{background:var(--card);border:.5px solid var(--border);border-radius:var(--radius);padding:10px 12px;display:flex;gap:12px;align-items:center}
.item.done{background:var(--muted);opacity:.62}
.cb{width:30px;height:30px;border-radius:50%;border:2px solid var(--green2);flex:none;background:transparent;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;padding:0}
.cb.on{background:var(--green2);border-color:var(--green2)}
.cb.sq{border-radius:7px}
.item.bsel{background:var(--greenbg)}
.bulkbar{display:flex;align-items:center;gap:10px;padding:8px 4px;margin-top:6px;border-bottom:.5px solid var(--border)}
.bulkall{background:none;border:none;padding:0;font-size:14px;color:var(--ink);cursor:pointer}
.bulkcount{margin-left:auto;font-size:12px;color:var(--ink3)}
.bulkedit{display:flex;align-items:center;gap:5px;padding:7px 12px;font-size:13px}
.bulkedit[disabled]{opacity:.45;pointer-events:none}
.bulkdelbtn{display:flex;align-items:center;gap:5px;padding:7px 12px;font-size:13px;font-weight:500;color:#fff;background:#E24B4A;border:none;border-radius:8px;cursor:pointer}
.bulkdelbtn[disabled]{opacity:.45;pointer-events:none}
.item.swipe{touch-action:pan-y;position:relative;will-change:transform}
.item.swiping{transition:none}
.item.swipereset{transition:transform .18s ease}
.bulkform .f{margin-bottom:12px}
.bulknote{font-size:12px;color:var(--ink2);background:var(--greenbg);border-radius:8px;padding:9px 11px;margin:0 0 14px}
.bulkkeep{background:var(--card);border:.5px solid var(--border);border-radius:8px;padding:10px 11px;font-size:13px;color:var(--ink2);width:100%;text-align:left;cursor:pointer}
.bulkactions{display:flex;gap:10px;margin-top:6px}
.bulkactions>button{flex:1}
.bulkactions .done[disabled]{opacity:.45;pointer-events:none}
.body{flex:1;min-width:0;cursor:pointer}
.nm{font-size:15px;font-weight:500;color:var(--ink)}
.item.done .nm{color:var(--ink2);text-decoration:line-through}
.mt{font-size:12px;color:var(--ink2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.done .mt{color:var(--ink3)}
.ty{font-size:17px;flex:none;color:var(--ink3);display:flex}
.ty.green{color:var(--green)}
.eco{font-size:12px;font-weight:500;border-radius:6px;padding:2px 7px;flex:none;min-width:22px;text-align:center}
.e-boldgreen{background:var(--green);color:#fff}
.e-green{background:var(--greenbg);color:var(--greentx)}
.e-amber{background:#FAEEDA;color:#633806}
.e-red{background:#E24B4A;color:#fff}
.item.done .eco{filter:grayscale(.35)}

.item.editing{display:block;border:1.5px solid var(--green2);background:var(--card);opacity:1}
.erow{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.enm{flex:1;font-size:15px;font-weight:500;color:var(--ink);border:none;border-bottom:1px solid var(--border);background:transparent;height:30px}
.lnk{background:none;border:none;color:var(--green);font-size:18px;display:flex;padding:0}
.seg{display:flex;background:var(--muted);border-radius:8px;padding:3px;margin-bottom:10px}
.seg button{flex:1;text-align:center;font-size:12px;color:var(--ink2);padding:7px 0;background:none;border:none;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:4px}
.seg button.on{font-weight:500;background:var(--card);color:var(--ink);box-shadow:0 0 0 .5px var(--border)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.f label{font-size:11px;color:var(--ink3);margin-bottom:3px;display:block}
.f select,.f input,.f textarea{width:100%;font-size:13px;background:var(--muted);border:.5px solid var(--border);border-radius:8px;padding:7px 10px;height:auto}
.f textarea{min-height:54px;resize:vertical}
.erow2{display:flex;align-items:center;justify-content:space-between}
.del{background:none;border:none;color:#A32D2D;font-size:13px;display:flex;align-items:center;gap:4px;padding:6px 0}
.done{font-size:13px;font-weight:500;background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 18px}

.uncheck{display:flex;align-items:center;gap:8px;margin:16px 2px}
.uncheck .ln{flex:1;height:.5px;background:var(--strong)}
.uncheck button{background:var(--green);color:#fff;font-size:13px;font-weight:500;border:none;border-radius:20px;padding:8px 15px;display:flex;align-items:center;gap:6px;flex:none}

.arch{margin-top:16px}
.archhd{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:13px;padding:4px 4px;background:none;border:none;width:100%}
.archhd .ct{font-size:11px;color:var(--ink3);margin-left:auto}
.archlist{margin-top:8px}

.empty{text-align:center;color:var(--ink3);padding:44px 20px}
.empty .big{font-size:34px;color:var(--green2);margin-bottom:10px}
.empty p{margin:4px 0}

.ovl{position:fixed;inset:0;background:rgba(23,52,4,.28);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.ovl.center{align-items:center}
.sheet{background:var(--bg);width:100%;max-width:460px;border-radius:16px 16px 0 0;padding:16px 16px 28px;max-height:86vh;overflow-y:auto}
.ovl.center .sheet{border-radius:16px;margin:0 12px}
.sheethd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheethd b{font-size:17px;font-weight:500}
.xbtn{background:none;border:none;color:var(--ink2);font-size:20px;display:flex;padding:4px}
.opt{display:flex;align-items:center;gap:10px;padding:11px 6px;border-top:.5px solid var(--border);font-size:14px;color:var(--ink);background:none;border-left:none;border-right:none;border-bottom:none;width:100%;text-align:left}
.opt .chk{margin-left:auto;color:var(--green);font-size:16px}
.navi{display:flex;align-items:center;gap:10px;padding:13px 6px;border-top:.5px solid var(--border);font-size:15px;color:var(--ink);width:100%;text-align:left}
button.navi{background:none;border-left:none;border-right:none;border-bottom:none;cursor:pointer}
.navi.muted{color:var(--ink3)}
.navi .soon{margin-left:auto;font-size:11px;color:var(--ink3);background:var(--card);border:.5px solid var(--border);border-radius:10px;padding:2px 8px}
.navi .soon.cur{color:var(--greentx);background:var(--greenbg);border-color:var(--green2)}
.fpanel .f{margin-bottom:12px}
.clearbtn{width:100%;background:var(--card);border:.5px solid var(--border);border-radius:8px;padding:11px;font-size:14px;color:var(--ink2);margin-top:4px}
.hint{font-size:12px;color:var(--ink3);margin:2px 2px 0}

.pagehd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.backbtn{width:32px;height:32px;border-radius:8px;background:var(--card);border:.5px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:18px;padding:0}
.addstorebtn{width:100%;background:var(--greenbg);border:.5px solid var(--green2);color:var(--greentx);border-radius:10px;padding:12px;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:14px}
.scard{background:var(--card);border:.5px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.scardtop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.scardtop .sname{flex:1;min-width:0;font-size:15px;font-weight:500;color:var(--ink);border:none;border-bottom:1px solid var(--border);background:transparent;height:30px}
.scardtop button{background:none;border:none;color:var(--ink3);font-size:16px;display:flex;padding:4px}

.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font-size:12px;color:var(--ink2);background:var(--card);border:.5px solid var(--border);border-radius:20px;padding:6px 12px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.tab.on{font-weight:500;color:var(--greentx);background:var(--greenbg);border-color:var(--green2)}
.subrow{display:flex;align-items:center;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.subrow::-webkit-scrollbar{display:none}

.schip.on{font-weight:500;color:var(--greentx);background:var(--greenbg);border-color:var(--green2)}
.addlink{font-size:12px;color:var(--green);display:flex;align-items:center;gap:3px;flex:none;background:none;border:none;padding:2px 4px;cursor:pointer}
.ncard{background:var(--card);border:.5px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px}
.ncard.exp{border:1.5px solid var(--green2)}
.ntop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.nname{font-size:15px;font-weight:500;color:var(--ink)}
.ndesc{font-size:12px;color:var(--ink2);margin-top:2px;line-height:1.45}
.nmeta{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.nmeta .m{font-size:11px;color:var(--ink2)}
.spill{font-size:11px;font-weight:500;border-radius:12px;padding:3px 9px}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;padding-top:10px;margin-top:10px;border-top:.5px solid var(--border)}
.qlab{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2)}
.qbar{height:5px;background:#EAE8DF;border-radius:3px;margin-top:3px}
.qfill{height:5px;border-radius:3px}
.srcs{margin-top:12px;padding-top:10px;border-top:.5px solid var(--border)}
.srcs .sh{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);margin-bottom:6px}
.srcln{display:flex;align-items:center;gap:6px;font-size:12px;color:#185FA5;margin-bottom:6px;text-decoration:none}
.barwrap{display:flex;height:8px;border-radius:5px;overflow:hidden;background:#EAE8DF}
.status-seg{display:flex;background:var(--muted);border-radius:8px;padding:3px;margin-top:10px}
.status-seg button{flex:1;font-size:12px;color:var(--ink2);padding:7px 0;background:none;border:none;border-radius:6px;cursor:pointer}
.status-seg button.on{font-weight:500;background:var(--card);box-shadow:0 0 0 .5px var(--border)}
.deflist{margin-top:4px}
.defrow{display:flex;gap:14px;padding:14px 4px;border-top:.5px solid var(--border);align-items:flex-start}
.deftier{font-size:18px;font-weight:500;color:var(--green);flex:none;width:48px}

.newscard{background:var(--card);border:.5px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.newscard.exp{border:1.5px solid var(--green2);cursor:default}
.nsrc{font-size:11px;color:var(--ink3)}
.ntitle{font-size:14px;font-weight:500;color:var(--ink);line-height:1.3}
.nbody{font-size:12px;color:var(--ink2);margin-top:4px;line-height:1.45}

.newbadge{font-size:10px;font-weight:500;color:#27500A;background:#EAF3DE;border-radius:10px;padding:2px 7px}
.addbtn{font-size:12px;font-weight:500;color:#fff;background:#639922;border:none;border-radius:16px;padding:7px 14px;display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.addbtn.done{background:#EAF3DE;color:#27500A}
.srclink{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#185FA5;text-decoration:none;margin-top:8px}
.botbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg);border-top:.5px solid var(--border);box-shadow:0 -2px 12px rgba(23,52,4,.06);padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.botinner{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.botrow{display:flex;align-items:center;gap:8px}
.botrow .addbar{margin:0;flex:1;min-width:0}
.botrow .tabs,.botrow .pills{margin:0;flex:1;min-width:0}
.botrow .backbtn{flex:none}
.botdraft{max-height:52vh;overflow-y:auto}
.botdraft .draft{margin:0}
.newscard.hl{background:#F5EDC4;border-color:#E4D48A}
.newscard.hl.exp{border-color:#D9C766}
.nact{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:5px;background:var(--muted);border:.5px solid var(--border);border-radius:16px;padding:6px 11px;cursor:pointer}
.nact.on{background:#F5EDC4;border-color:#E4D48A;color:#6b5a12;font-weight:500}
.srcrow{display:flex;align-items:center;gap:8px;padding:9px 2px;border-top:.5px solid var(--border);font-size:13px;color:var(--ink)}
.srcrow .u{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srcrow button{background:none;border:none;color:var(--ink3);padding:2px;display:flex;cursor:pointer}
</style>
</head>

function migrateStores(arr){
 return (arr||[]).map(function(s){
  if(typeof s==='string')return {id:uid(),name:s,eco:'',category:'',note:''};
  return {id:s.id||uid(),name:s.name||'',eco:(s.eco==null?'':s.eco),category:s.category||'',note:s.note||''};
 });
}
function load(){
 try{var raw=localStorage.getItem(KEY);
  if(raw){var d=JSON.parse(raw);
   state.items=d.items||[];state.stores=migrateStores(d.stores);state.sort=d.sort||'smart';
   if(d.draft)state.draft=Object.assign(state.draft,d.draft);
   state.needs=Array.isArray(d.needs)?d.needs:seedNeeds();
   state.news=mergeNews(Array.isArray(d.news)?d.news:[],seedNews());
   state.newsSources=Array.isArray(d.newsSources)?d.newsSources:[];
  } else { state.needs=seedNeeds(); state.news=seedNews(); }
 }catch(e){ if(!state.needs.length)state.needs=seedNeeds(); if(!state.news.length)state.news=seedNews(); }
}
function save(){
 try{localStorage.setItem(KEY,JSON.stringify({items:state.items,stores:state.stores,sort:state.sort,draft:state.draft,needs:state.needs,news:state.news,newsSources:state.newsSources}));}catch(e){}
 if(cloud.enabled&&cloud.user)cloudSync();
}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function escA(s){return esc(s).replace(/'/g,'&#39;');}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function trunc(s){return s.length>10?s.slice(0,10)+'…':s;}
function freqAbbr(it){var f=FREQS.find(function(x){return x[0]===it.freqUnit;});if(it.freqUnit==='custom')return (it.freqDays||0)+'d';return f?f[2]:'';}
function ecoCls(v){v=Number(v);return v>=9?'e-boldgreen':v>=7?'e-green':v>=4?'e-amber':'e-red';}

function nextDue(it){
 var d=new Date(it.checkedAt);
 switch(it.freqUnit){
  case 'weekly':d.setDate(d.getDate()+7);break;
  case 'monthly':d.setMonth(d.getMonth()+1);break;
  case '2months':d.setMonth(d.getMonth()+2);break;
  case 'quarterly':d.setMonth(d.getMonth()+3);break;
  case 'semiannual':d.setMonth(d.getMonth()+6);break;
  case 'annual':d.setFullYear(d.getFullYear()+1);break;
  case 'custom':d.setDate(d.getDate()+(Number(it.freqDays)||30));break;
  default:d.setDate(d.getDate()+7);
 }
 return d.getTime();
}
function refreshRecurring(){
 var now=Date.now(),ch=false;
 state.items.forEach(function(it){
  if(it.type==='recurring'&&it.checked&&it.checkedAt&&now>=nextDue(it)){it.checked=false;ch=true;}
 });
 if(ch)save();
}

function matches(it){
 var f=state.filter;
 if(state.search&&it.name.toLowerCase().indexOf(state.search.toLowerCase())<0)return false;
 if(f.store&&it.store!==f.store)return false;
 if(f.type&&it.type!==f.type)return false;
 if(f.freq&&!(it.type==='recurring'&&it.freqUnit===f.freq))return false;
 if(f.tag&&it.tag!==f.tag)return false;
 return true;
}
function typeRank(t){return t==='onetime'?0:t==='regular'?1:2;}
function freqRank(it){if(it.type!=='recurring')return 999;var i=FREQS.findIndex(function(x){return x[0]===it.freqUnit;});return it.freqUnit==='custom'?100+(Number(it.freqDays)||0):i;}
function comparator(isChecked){
 var s=state.sort;
 if(s==='smart'){return isChecked?function(a,b){return (b.checkedAt||0)-(a.checkedAt||0);}:function(a,b){return (a.createdAt||0)-(b.createdAt||0);};}
 if(s==='name')return function(a,b){return a.name.localeCompare(b.name);};
 if(s==='namez')return function(a,b){return b.name.localeCompare(a.name);};
 if(s==='type')return function(a,b){return typeRank(a.type)-typeRank(b.type)||a.name.localeCompare(b.name);};
 if(s==='freq')return function(a,b){return freqRank(a)-freqRank(b)||a.name.localeCompare(b.name);};
 if(s==='tag')return function(a,b){return (a.tag||'￿').localeCompare(b.tag||'￿')||a.name.localeCompare(b.name);};
 if(s==='store')return function(a,b){return (a.store||'￿').localeCompare(b.store||'￿')||a.name.localeCompare(b.name);};
 return function(){return 0;};
}
function groups(){
 var vis=state.items.filter(matches);
 var unchecked=vis.filter(function(i){return !i.checked;}).sort(comparator(false));
 var purchased=vis.filter(function(i){return i.checked&&i.type!=='onetime';}).sort(comparator(true));
 var archive=vis.filter(function(i){return i.checked&&i.type==='onetime';}).sort(comparator(true));
 return {unchecked:unchecked,purchased:purchased,archive:archive};
}

(function(){

  '<div class="erow2"><button class="del" data-act="newsdel" data-id="'+a.id+'">'+ico('trash')+' Delete</button><button class="done" data-act="newsdone" data-id="'+a.id+'">Done</button></div></div>';
}
function newsCard(a){if(a.id===state.newsEditingId)return newsEdit(a);if(a.id===state.newsExpandedId)return newsExpanded(a);return newsCollapsed(a);}
function renderNews(){
 var head='<div class="hd"><div class="brand"><span class="logo">'+ico('plant')+'</span><div><small>The Sustainable Home</small><b>News</b></div></div></div>';
 var barrow='<div style="display:flex;align-items:center;margin:0 2px 12px;gap:8px;"><button class="addlink" data-act="newsfilthl" style="'+(state.newsFilterHL?'color:#b58a12;font-weight:500;':'')+'">'+ico('star')+(state.newsFilterHL?'Highlighted':'Highlights')+'</button><button class="addlink" data-act="newssortopen" style="margin-left:auto;">'+ico('sort')+' '+sortLabel()+'</button><button class="addlink" data-act="newssources">'+ico('plus')+'Sources</button></div>';
 if(state.newsSort==='unread'){if(!state.newsOrder)freezeNewsOrder();}else{state.newsOrder=null;}
 var arr=state.news.filter(function(a){return (state.newsFilterCat==='all'||a.category===state.newsFilterCat)&&(state.newsFilterAvail==='all'||a.availability===state.newsFilterAvail)&&(!state.newsFilterHL||a.highlight);});
 arr=newsSorted(arr);
 var feed=arr.length?arr.map(newsCard).join(''):'<p class="hint" style="padding:6px 2px">No articles match. Try clearing filters.</p>';
 return head+barrow+newsFilters()+feed;
}

function mapItemRow(it){return {id:it.id,user_id:cloud.user.id,name:it.name,type:it.type,freq_unit:it.freqUnit||'weekly',freq_days:it.freqDays||7,tag:it.tag||'',store:it.store||'',eco:(it.eco===''||it.eco==null)?null:Number(it.eco),checked:!!it.checked,checked_at:it.checkedAt?new Date(it.checkedAt).toISOString():null,created_at:it.createdAt?new Date(it.createdAt).toISOString():new Date().toISOString()};}
function rowItem(r){return {id:r.id,name:r.name,type:r.type,freqUnit:r.freq_unit,freqDays:r.freq_days,tag:r.tag,store:r.store,eco:(r.eco==null?'':r.eco),checked:r.checked,checkedAt:r.checked_at?Date.parse(r.checked_at):null,createdAt:r.created_at?Date.parse(r.created_at):Date.now()};}
function mapStoreRow(s){return {id:s.id,user_id:cloud.user.id,name:s.name||'',eco:(s.eco===''||s.eco==null)?null:Number(s.eco),category:s.category||'',note:s.note||''};}
function rowStore(r){return {id:r.id,name:r.name,eco:(r.eco==null?'':r.eco),category:r.category||'',note:r.note||''};}
function mapNeedRow(n){return {id:n.id,user_id:cloud.user.id,category:n.category,name:n.name||'',description:n.desc||'',cost:n.cost||2,roi:(n.roi==null||n.roi==='')?null:Number(n.roi),status:n.status||'idea',q:n.q||[5,5,5,5,5,5],sources:n.sources||[]};}
function rowNeed(r){return {id:r.id,category:r.category,name:r.name,desc:r.description,cost:r.cost,roi:r.roi,status:r.status,q:r.q||[5,5,5,5,5,5],sources:r.sources||[]};}
function mapNewsRow(a){return {id:a.id,user_id:cloud.user.id,title:a.title||'',source:a.source||'',url:a.url||'',body:a.body||'',category:a.category||'house',availability:a.availability||'available',published_at:a.publishedAt?new Date(a.publishedAt).toISOString():new Date().toISOString(),viewed:!!a.viewed,added:!!a.added,highlighted:!!a.highlight};}
function rowNews(r){return {id:r.id,title:r.title,source:r.source,url:r.url,body:r.body,category:r.category,availability:r.availability,publishedAt:r.published_at?Date.parse(r.published_at):Date.now(),viewed:r.viewed,added:r.added,highlight:!!r.highlighted};}
function renderLogin(){
 return '<div style="max-width:360px;margin:44px auto 0;text-align:center;">'+
  '<div style="width:56px;height:56px;border-radius:50%;background:var(--leaf);display:flex;align-items:center;justify-content:center;color:var(--greentx);margin:0 auto 14px;font-size:26px;">'+ico('plant')+'</div>'+
  '<div style="font-size:20px;font-weight:500;color:var(--ink);">The Sustainable Home</div>'+
  '<div style="font-size:13px;color:var(--ink2);margin:6px 0 20px;line-height:1.5;">Sign in to sync your list, stores, ideas, and news across devices.</div>'+
  (cloud.authMsg?'<div style="font-size:12px;color:var(--greentx);background:var(--greenbg);border-radius:8px;padding:9px 11px;margin-bottom:12px;">'+esc(cloud.authMsg)+'</div>':'')+
  (cloud.authErr?'<div style="font-size:12px;color:#8a1c1c;background:#fbe9e9;border-radius:8px;padding:9px 11px;margin-bottom:12px;">'+esc(cloud.authErr)+'</div>':'')+
  '<input data-act="authemail" value="'+escA(cloud.authEmail)+'" placeholder="you@email.com" inputmode="email" autocomplete="email" style="width:100%;height:42px;border:.5px solid var(--border);border-radius:10px;padding:0 12px;font-size:15px;margin-bottom:10px;box-sizing:border-box;"/>'+
  '<input data-act="authpass" value="'+escA(cloud.authPass)+'" type="password" placeholder="Password" autocomplete="'+(cloud.authMode==='signup'?'new-password':'current-password')+'" style="width:100%;height:42px;border:.5px solid var(--border);border-radius:10px;padding:0 12px;font-size:15px;margin-bottom:10px;box-sizing:border-box;"/>'+
  '<button class="done" data-act="emailpass" style="width:100%;padding:12px;border-radius:10px;font-size:14px;">'+(cloud.authMode==='signup'?'Create account':'Sign in')+'</button>'+
  (cloud.authMode==='signin'?'<div style="margin-top:10px;"><button class="addlink" data-act="forgotpass" style="margin:0 auto;font-size:12px;">Forgot password?</button></div>':'')+
  '<div style="font-size:12px;color:var(--ink2);margin-top:14px;">'+(cloud.authMode==='signup'?'Already have an account? ':"Don't have an account? ")+'<button class="addlink" data-act="authmode" style="display:inline;padding:0;">'+(cloud.authMode==='signup'?'Sign in':'Create one')+'</button></div>'+
  '<div style="margin-top:14px;"><button class="addlink" data-act="skipauth" style="margin:0 auto;">Use without signing in</button></div>'+
 '</div>';
}
async function doEmailPass(){
 var em=(cloud.authEmail||'').trim();var pw=cloud.authPass||'';
 cloud.authMsg='';cloud.authErr='';
 if(!em||!pw){cloud.authErr='Enter your email and password.';render();return;}
 if(!sb){cloud.authErr='Cloud sync is unavailable right now.';render();return;}
 if(cloud.authMode==='signup'&&pw.length<6){cloud.authErr='Password must be at least 6 characters.';render();return;}
 try{
  if(cloud.authMode==='signup'){
   var su=await sb.auth.signUp({email:em,password:pw});
   if(su.error){cloud.authErr=su.error.message;render();return;}
   if(!(su.data&&su.data.session)){cloud.authMode='signin';cloud.authPass='';cloud.authMsg='Account created. Check your email to confirm, then sign in.';render();}
  }else{
   var si=await sb.auth.signInWithPassword({email:em,password:pw});
   if(si.error){cloud.authErr=si.error.message;render();return;}
   cloud.authPass='';
  }
 }catch(e){cloud.authErr='Something went wrong. Please try again.';render();}
}
async function doForgotPass(){
 var em=(cloud.authEmail||'').trim();
 cloud.authMsg='';cloud.authErr='';
 if(!em){cloud.authErr='Enter your email first, then tap Forgot password.';render();return;}
 if(!sb){cloud.authErr='Cloud sync is unavailable right now.';render();return;}
 try{
  var rp=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.href});
  if(rp.error){cloud.authErr=rp.error.message;render();return;}
  cloud.authMsg='Password reset link sent. Check your email.';render();
 }catch(e){cloud.authErr='Something went wrong. Please try again.';render();}
}
async function initAuth(){
 try{
  var g=await sb.auth.getSession();
  if(g.data&&g.data.session){cloud.user=g.data.session.user;await pullAll();}
  render();
  sb.auth.onAuthStateChange(function(ev,session){
   if(session&&session.user){ if(!cloud.user){cloud.user=session.user;cloud.authMsg='';pullAll().then(render);} }
   else { cloud.user=null; render(); }
  });
 }catch(e){ cloud.enabled=false; render(); }
}
async function pullAll(){
 try{
  var uid=cloud.user.id;
  var r=await Promise.all([
   sb.from('consumables_items').select('*').eq('user_id',uid),
   sb.from('stores').select('*').eq('user_id',uid),
   sb.from('needs_ideas').select('*').eq('user_id',uid),
   sb.from('news_articles').select('*').eq('user_id',uid),
   sb.from('profiles').select('*').eq('id',uid).maybeSingle()
  ]);
  var items=r[0].data||[],stores=r[1].data||[],needs=r[2].data||[],news=r[3].data||[],prof=r[4].data;
  if(items.length===0&&stores.length===0&&needs.length===0&&news.length===0){
   await pushAll();
  } else {
   state.items=items.map(rowItem);
   state.stores=stores.map(rowStore);
   state.needs=needs.map(rowNeed);
   state.news=news.map(rowNews);
   if(prof){ if(prof.consumables_sort)state.sort=prof.consumables_sort; if(prof.news_sort)state.newsSort=prof.news_sort; }
   save();
  }
 }catch(e){}
}
var _syncT=null;
function cloudSync(){ if(!cloud.user)return; if(_syncT)clearTimeout(_syncT); _syncT=setTimeout(function(){pushAll();},1200); }
async function syncTable(name,rows,uid){
 if(rows.length){ await sb.from(name).upsert(rows); }
 var ids=rows.map(function(r){return r.id;});
 var del=sb.from(name).delete().eq('user_id',uid);
 if(ids.length){ del=del.not('id','in','('+ids.join(',')+')'); }
 await del;
}
async function pushAll(){
 if(!cloud.user)return;
 try{
  var uid=cloud.user.id;
  await Promise.all([
   syncTable('consumables_items',state.items.map(mapItemRow),uid),
   syncTable('stores',state.stores.map(mapStoreRow),uid),
   syncTable('needs_ideas',state.needs.map(mapNeedRow),uid),
   syncTable('news_articles',state.news.map(mapNewsRow),uid),
   sb.from('profiles').upsert({id:uid,consumables_sort:state.sort,news_sort:state.newsSort})
  ]);
 }catch(e){}
}

load();
if(cloud.enabled){initAuth();}
render();
setInterval(function(){if(!state.overlay&&!state.editingId&&state.view==='consumables'){refreshRecurring();render();}},60000);
</script>
